
name: Trading System Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check-project:
    runs-on: ubuntu-latest

    steps:
      - name: Get project code
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          test -f index.html
          test -f script.js
          test -f style.css
          test -f candles.json
          echo "Trading system file checks passed!"
